name: SNO OpenShift Install

on:
  workflow_dispatch:
    inputs:
      ocp_version:
        description: "OpenShift version to install (e.g. 4.22.0-ec.3, 4.18.6)"
        required: true
        default: "4.22.0-ec.3"
        type: string
      install_wait_attempts:
        description: "INSTALL_WAIT_ATTEMPTS — openshift-install retries per invocation (~90 min each)"
        required: false
        default: "2"
        type: string
      remediation_install_wait_attempts:
        description: >
          REMEDIATION_INSTALL_WAIT_ATTEMPTS — if primary waits fail but workdir/auth/kubeconfig exists,
          run this many extra install-complete waits (helps slow MCO reconcile). Same ~90 min cadence each.
        required: false
        default: "3"
        type: string
      post_copy_iso_sleep_sec:
        description: "POST_COPY_ISO_SLEEP_SEC — seconds after SCP so webcache/storage can expose the full ISO"
        required: false
        default: "120"
        type: string
      idrac_deploy_after_insert_sec:
        description: "IDRAC_DEPLOY_AFTER_INSERT_SEC — seconds after Virtual CD insert before boot order + restart"
        required: false
        default: "120"
        type: string
      idrac_deploy_before_restart_sec:
        description: "IDRAC_DEPLOY_BEFORE_RESTART_SEC — seconds after one-time CD boot is set before ForceRestart"
        required: false
        default: "30"
        type: string
      idrac_deploy_after_restart_sec:
        description: "IDRAC_DEPLOY_AFTER_RESTART_SEC — seconds after ForceRestart before polling power state"
        required: false
        default: "45"
        type: string
      iso_http_probe:
        description: "ISO_HTTP_PROBE — true/1 to confirm the ISO URL returns HTTP 200/206 before iDRAC reboot"
        required: false
        default: "true"
        type: string

defaults:
  run:
    shell: bash

env:
  KUBECONFIG_PATH: ${{ github.workspace }}/workdir/auth/kubeconfig
  INSTALL_WAIT_ATTEMPTS: ${{ inputs.install_wait_attempts }}
  REMEDIATION_INSTALL_WAIT_ATTEMPTS: ${{ inputs.remediation_install_wait_attempts }}
  POST_COPY_ISO_SLEEP_SEC: ${{ inputs.post_copy_iso_sleep_sec }}
  IDRAC_DEPLOY_AFTER_INSERT_SEC: ${{ inputs.idrac_deploy_after_insert_sec }}
  IDRAC_DEPLOY_BEFORE_RESTART_SEC: ${{ inputs.idrac_deploy_before_restart_sec }}
  IDRAC_DEPLOY_AFTER_RESTART_SEC: ${{ inputs.idrac_deploy_after_restart_sec }}
  ISO_HTTP_PROBE: ${{ inputs.iso_http_probe }}

jobs:
  install:
    runs-on: self-hosted
    # Long installs: ISO + iDRAC + bootstrap + primary waits + remediation waits
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: make deps

      - name: Run SNO install
        id: install
        run: |
          set -eo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          export INSTALL_WAIT_ATTEMPTS="${{ inputs.install_wait_attempts }}"
          export REMEDIATION_INSTALL_WAIT_ATTEMPTS="${{ inputs.remediation_install_wait_attempts }}"
          make install \
            OCP_VERSION="${{ inputs.ocp_version }}" \
            IDRAC_IP="192.168.1.228" \
            IDRAC_USER="root" \
            IDRAC_PW="${{ secrets.IDRAC_PW }}"
      - name: Collect install diagnostics (failure)
        if: failure()
        run: chmod +x scripts/collect_abi_install_diagnostics.sh && scripts/collect_abi_install_diagnostics.sh

      - name: Upload ABI install diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abi-install-diagnostics
          path: abi-install-diagnostics/
          retention-days: 7

      - name: Wait for Cluster Operators
        run: oc --kubeconfig="${KUBECONFIG_PATH}" wait --for=condition=Available clusteroperators --all --timeout=1800s

      # Idempotent: subscriptions/namespaces may already exist on workflow retry.
      - name: Apply operator-install manifests
        run: oc apply --kubeconfig="${KUBECONFIG_PATH}" -f abi-master-0/extra-manifests/operator-install/

      - name: Validate no degraded operators
        run: |
          degraded=$(oc --kubeconfig="${KUBECONFIG_PATH}" get clusteroperators -o json | jq -r '.items[] | select(.status.conditions[] | select(.type=="Degraded" and .status=="True")) | .metadata.name')
          if [[ -n "$degraded" ]]; then
            echo "❌ Degraded operators detected: $degraded"
            exit 1
          fi
          echo "✅ No degraded Operators"

      # InstallPlan approval, CSV waits, and operator CRs are implemented in scripts/apply_operator_config.py
      # (uses kubernetes Python client; requires make deps / requirements.txt).
      - name: Apply operator-config (InstallPlans, LVMS/SR-IOV, manifests)
        run: ./.venv/bin/python3 scripts/apply_operator_config.py --kubeconfig="${KUBECONFIG_PATH}"

      - name: Apply node-exporter-zoneinfo (monitoring)
        run: oc apply --kubeconfig="${KUBECONFIG_PATH}" -k abi-master-0/extra-manifests/node-exporter-zoneinfo/

      - name: Upload auth artifact for kubeconfig
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth
          path: |
            workdir/auth/kubeadmin-password
            workdir/auth/kubeconfig
          retention-days: 1
