name: SNO OpenShift Install

on:
  workflow_dispatch:
    inputs:
      ocp_version:
        description: "OpenShift version to install (e.g. 5.0.0-ec.6, 4.22.0-ec.3, 4.18.6)"
        required: true
        default: "5.0.0-ec.6"
        type: string
      release_image:
        description: >
          RELEASE_IMAGE — full release image pullspec to extract openshift-install from.
          Overrides ocp_version; use for pre-GA / mirrored / CI images that do not follow
          the public quay tag pattern. Leave empty to build the image from ocp_version.
        required: false
        default: ""
        type: string
      install_wait_attempts:
        description: "INSTALL_WAIT_ATTEMPTS — openshift-install retries per invocation (~90 min each)"
        required: false
        default: "2"
        type: string
      remediation_install_wait_attempts:
        description: >
          REMEDIATION_INSTALL_WAIT_ATTEMPTS — if primary waits fail but workdir/auth/kubeconfig exists,
          run this many extra install-complete waits (helps slow MCO reconcile). Same ~90 min cadence each.
        required: false
        default: "3"
        type: string
      api_ready_wait_sec:
        description: >
          API_READY_WAIT_SEC — max seconds to wait for kube-apiserver /readyz between install-complete
          retries (SNO MCO reboot: no route to host / connection refused). 0 disables.
        required: false
        default: "1800"
        type: string
      api_ready_settle_sec:
        description: >
          API_READY_SETTLE_SEC — settle time after /readyz is stably ok before restarting wait-for
          (avoids burning the ~40m cluster-init window during post-reboot flap).
        required: false
        default: "90"
        type: string
      api_ready_stable_polls:
        description: "API_READY_STABLE_POLLS — consecutive successful /readyz polls required"
        required: false
        default: "3"
        type: string
      post_copy_iso_sleep_sec:
        description: "POST_COPY_ISO_SLEEP_SEC — seconds after SCP so webcache/storage can expose the full ISO"
        required: false
        default: "120"
        type: string
      idrac_deploy_after_insert_sec:
        description: "IDRAC_DEPLOY_AFTER_INSERT_SEC — seconds after Virtual CD insert before boot order + restart"
        required: false
        default: "120"
        type: string
      idrac_deploy_before_restart_sec:
        description: "IDRAC_DEPLOY_BEFORE_RESTART_SEC — seconds after one-time CD boot is set before ForceRestart"
        required: false
        default: "30"
        type: string
      idrac_deploy_after_restart_sec:
        description: "IDRAC_DEPLOY_AFTER_RESTART_SEC — seconds after ForceRestart before polling power state"
        required: false
        default: "45"
        type: string
      iso_http_probe:
        description: "ISO_HTTP_PROBE — true/1 to confirm the ISO URL returns HTTP 200/206 before iDRAC reboot"
        required: false
        default: "true"
        type: string

defaults:
  run:
    shell: bash

env:
  KUBECONFIG_PATH: ${{ github.workspace }}/workdir/auth/kubeconfig
  INSTALL_WAIT_ATTEMPTS: ${{ inputs.install_wait_attempts }}
  REMEDIATION_INSTALL_WAIT_ATTEMPTS: ${{ inputs.remediation_install_wait_attempts }}
  API_READY_WAIT_SEC: ${{ inputs.api_ready_wait_sec }}
  API_READY_SETTLE_SEC: ${{ inputs.api_ready_settle_sec }}
  API_READY_STABLE_POLLS: ${{ inputs.api_ready_stable_polls }}
  API_READY_POLL_SEC: "15"
  POST_COPY_ISO_SLEEP_SEC: ${{ inputs.post_copy_iso_sleep_sec }}
  IDRAC_DEPLOY_AFTER_INSERT_SEC: ${{ inputs.idrac_deploy_after_insert_sec }}
  IDRAC_DEPLOY_BEFORE_RESTART_SEC: ${{ inputs.idrac_deploy_before_restart_sec }}
  IDRAC_DEPLOY_AFTER_RESTART_SEC: ${{ inputs.idrac_deploy_after_restart_sec }}
  ISO_HTTP_PROBE: ${{ inputs.iso_http_probe }}
  RELEASE_IMAGE: ${{ inputs.release_image }}
  CLUSTER_IP: "192.168.1.133"

jobs:
  install:
    runs-on: self-hosted
    # Long installs: ISO + iDRAC + bootstrap + primary waits + API-ready gates + remediation waits
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the Go installer
        run: make build

      - name: Run SNO install
        id: install
        run: |
          set -eo pipefail
          export INSTALL_WAIT_ATTEMPTS="${{ inputs.install_wait_attempts }}"
          export REMEDIATION_INSTALL_WAIT_ATTEMPTS="${{ inputs.remediation_install_wait_attempts }}"
          export API_READY_WAIT_SEC="${{ inputs.api_ready_wait_sec }}"
          export API_READY_SETTLE_SEC="${{ inputs.api_ready_settle_sec }}"
          export API_READY_STABLE_POLLS="${{ inputs.api_ready_stable_polls }}"
          export API_READY_POLL_SEC="${API_READY_POLL_SEC:-15}"
          export ISO_HTTP_PROBE="${{ inputs.iso_http_probe }}"
          export POST_COPY_ISO_SLEEP_SEC="${{ inputs.post_copy_iso_sleep_sec }}"
          export IDRAC_DEPLOY_AFTER_INSERT_SEC="${{ inputs.idrac_deploy_after_insert_sec }}"
          export IDRAC_DEPLOY_BEFORE_RESTART_SEC="${{ inputs.idrac_deploy_before_restart_sec }}"
          export IDRAC_DEPLOY_AFTER_RESTART_SEC="${{ inputs.idrac_deploy_after_restart_sec }}"
          export RELEASE_IMAGE="${{ inputs.release_image }}"
          export IDRAC_USER="root"
          export IDRAC_PW="${{ secrets.IDRAC_PW }}"
          make install \
            OCP_VERSION="${{ inputs.ocp_version }}" \
            RELEASE_IMAGE="${{ inputs.release_image }}"

      - name: Collect install diagnostics (failure)
        if: failure()
        run: make diagnostics

      - name: Upload ABI install diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abi-install-diagnostics
          path: abi-install-diagnostics/
          retention-days: 7

      - name: Wait for API before Day-2
        run: ./sno-installer wait-api-ready --state config/sno-state.yaml

      - name: Wait for Cluster Operators
        run: ./sno-installer day2 wait-co --state config/sno-state.yaml

      - name: Apply operator day-2 (phases + OLM/CRs + zoneinfo)
        run: ./sno-installer day2 post-install abi-master-0/extra-manifests/node-exporter-zoneinfo --state config/sno-state.yaml

      - name: Validate no degraded operators
        run: ./sno-installer day2 degraded-check --state config/sno-state.yaml

      - name: Upload auth artifact for kubeconfig
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth
          path: |
            workdir/auth/kubeadmin-password
            workdir/auth/kubeconfig
          retention-days: 1
