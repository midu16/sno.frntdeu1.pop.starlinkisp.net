# Supplementary node_exporter (zoneinfo, interrupts, softirqs) for cluster Prometheus.
# Deploys into openshift-monitoring; cluster Prometheus discovers the ServiceMonitor.
# Includes ClusterRoleBinding to grant privileged SCC to default SA (for hostPID/hostPath/runAsUser=0).
# Usage: oc apply -k abi-master-0/extra-manifests/node-exporter-zoneinfo/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - clusterrolebinding-privileged-scc.yaml
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml
