apiVersion: performance.openshift.io/v2
kind: PerformanceProfile
metadata:
  name: perf-profile-48c
spec:
  cpu:
    isolated: "2-19,22-47"    # Reserve CPUs for workloads
    reserved: "0-1,20-21"     # Reserve CPUs for platform
    balanceIsolated: false    # Disable kernel scheduler balancing
  hugepages:
    # Use 2M as default so both 2Mi and 1Gi pages are available (default 1G would remove 2M).
    defaultHugepagesSize: "2M"
    pages:
      - size: "2M"
        count: 256             # 512Mi allocatable as hugepages-2Mi (e.g. SR-IOV DPDK test pods)
      - size: "1G"
        count: 8                # 8Gi allocatable; 30 would exceed ~31Gi node memory
  realTimeKernel:
    enabled: false
  numa:
    # All guaranteed QoS containers get resources from a single NUMA node
    topologyPolicy: "restricted"
  workloadHints:
    realTime: false
    highPowerConsumption: false
    perPodPowerManagement: true
  globallyDisableIrqLoadBalancing: false
  nodeSelector:
    node-role.kubernetes.io/master: ""
